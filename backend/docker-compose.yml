name: nasa-monitor
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor"]
      interval: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://monitor:monitor@db:5432/monitor
    ports: ["8010:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./data:/app/data", "./config:/app/config"]
  web:
    build: ../frontend/frontend
    ports: ["${WEB_PORT:-80}:80"]
    depends_on: [api]
volumes:
  pgdata:
