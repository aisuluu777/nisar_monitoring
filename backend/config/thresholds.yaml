# Предварительные пороги (раздел 6 ТЗ). Подбираются на ретроспективе и утверждаются с МЧС.
version: "thr-0.1"
min_baseline_n: 6            # минимум наблюдений в норме, иначе серый
min_reliable_frac: 0.3       # доля надёжных пикселей / когерентность, иначе серый
max_data_age_days: 36        # три цикла по 12 дней без данных — серый
z_signal: 3.0                # жёлтый: смещение / скорость ледника
z_context: 2.5               # жёлтый: осадки, влажность, снег
z_confirm: 1.5               # подтверждающий сигнал для красного
min_cluster_cells: 3         # кластер соседних ячеек
